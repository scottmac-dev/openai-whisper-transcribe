<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AS1 STT API</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <div class="top-header">
            <span class="label">Whisper Transcribe</span>
        </div>

        <!-- Exactly one .view is visible at a time, chosen by app.js setting `hidden` on all the others. -->
        <div class="stage-wrap">
            <div class="stage-glow" id="stageGlow"></div>
            <div class="stage">

                <!-- idle -->
                <div class="view" data-view="idle">
                    <div class="mic-wrap">
                        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                        <button class="mic-btn" id="recordBtn" type="button" aria-label="Start recording">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
                        </button>
                    </div>
                    <div class="stage-title">Click to start transcribing</div>
                </div>

                <!-- recording -->
                <div class="view" data-view="recording" hidden>
                    <div class="mic-wrap live">
                        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                        <button class="mic-btn" id="stopBtn" type="button" aria-label="Stop recording">
                            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                        </button>
                    </div>
                    <div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="stage-sub">Click to stop</div>
                </div>

                <!-- review — nothing has been uploaded yet, so Discard just
                     clears the local buffer, no server round trip -->
                <div class="view" data-view="review" hidden>
                    <div class="stage-title">Ready to send</div>
                    <div class="stage-sub" id="reviewMeta"></div>
                    <div class="review-actions">
                        <button class="ghost-btn" id="discardBtn" type="button">Discard</button>
                        <button class="primary-btn" id="sendBtn" type="button">Send</button>
                    </div>
                </div>

                <!-- transcribing — request is in flight -->
                <div class="view" data-view="transcribing" hidden>
                    <div class="spinner"></div>
                    <div class="stage-title" id="transcribingText"></div>
                </div>

                <!-- oversized — over the 25 MB upload limit, cannot send -->
                <div class="view" data-view="oversized" hidden>
                    <div class="stage-title" id="oversizedText"></div>
                    <button class="ghost-btn" id="oversizedResetBtn" type="button">Clear</button>
                </div>

                <!-- done / transcript -->
                <div class="view transcript" data-view="done" hidden>
                    <div id="metadata"></div>
                    <div id="transcript" class="transcript-scroll"></div>
                    <div class="stage-footer">
                        <button class="ghost-btn" id="newSessionBtn" type="button">New session</button>
                    </div>
                </div>

                <!-- error -->
                <div class="view" data-view="error" hidden>
                    <div class="stage-title" id="errorText"></div>
                    <button class="ghost-btn" id="errorResetBtn" type="button">Try again</button>
                </div>

            </div>
        </div>

        <div class="status-line">
            <span class="sdot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
