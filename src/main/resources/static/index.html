<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AS1 STT API</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1 class="visually-hidden">Speech to text transcription</h1>

        <!-- Server bar: global token usage left, uptime right, both polled on the same tick -->
        <header class="top-header" id="serverStatus">
            <div class="header-left">
                <span class="label">Token usage |</span>
                <div class="server-status" id="tokenStats">
                    <span class="meta">
                        <span class="meta-key">input</span>
                        <span class="meta-val" id="statsInput">--</span>
                    </span>
                    <span class="meta">
                        <span class="meta-key">output</span>
                        <span class="meta-val" id="statsOutput">--</span>
                    </span>
                    <span class="meta">
                        <span class="meta-key">total</span>
                        <span class="meta-val" id="statsTotal">--</span>
                    </span>
                </div>
            </div>
            <div class="server-status">
                <span class="meta">
                    <span class="meta-key">uptime</span>
                    <span class="meta-val" id="serverUptime">--</span>
                </span>
            </div>
        </header>

        <!-- Shown only while the uptime poll cannot reach the server -->
        <div class="offline-banner" id="offlineBanner" role="alert" hidden>
            Disconnected — the server is unreachable.
        </div>

        <!-- Exactly one .view is visible at a time, chosen by app.js setting `hidden` on all the others. -->
        <div class="stage-wrap">
            <div class="stage-glow" id="stageGlow"></div>
            <div class="stage">

                <!-- idle -->
                <div class="view" data-view="idle" tabindex="-1">
                    <div class="mic-wrap">
                        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                        <button class="mic-btn" id="recordBtn" type="button" aria-label="Start recording" aria-pressed="false" data-autofocus>
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
                        </button>
                    </div>
                    <div class="stage-title" id="idleTitle">Click to start transcribing</div>
                </div>

                <!-- recording -->
                <div class="view" data-view="recording" tabindex="-1" hidden>
                    <div class="mic-wrap live">
                        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                        <button class="mic-btn" id="stopBtn" type="button" aria-label="Stop recording" aria-pressed="true" data-autofocus>
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                        </button>
                    </div>
                    <div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
                    <div class="stage-sub">Click to stop and transcribe</div>
                </div>

                <!-- transcribing — request is in flight -->
                <div class="view" data-view="transcribing" tabindex="-1" hidden>
                    <div class="spinner"></div>
                    <div class="stage-title" id="transcribingText"></div>
                </div>

                <!-- oversized — over the 25 MB upload limit, cannot send -->
                <div class="view" data-view="oversized" tabindex="-1" hidden>
                    <div class="stage-title" id="oversizedText"></div>
                    <button class="ghost-btn" id="oversizedResetBtn" type="button">Clear</button>
                </div>

                <!-- done / transcript — "New session" starts the next recording -->
                <div class="view transcript" data-view="done" tabindex="-1" hidden>
                    <div id="transcript" class="transcript-scroll" role="status" tabindex="-1" data-autofocus></div>
                    <div class="stage-footer">
                        <button class="ghost-btn icon-btn home-btn" id="homeBtn" type="button" aria-label="Back to the start screen" title="Home">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
                        </button>
                        <button class="ghost-btn icon-btn" id="usageBtn" type="button">
                            See metrics
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
                        </button>
                        <button class="primary-btn compact icon-btn" id="newSessionBtn" type="button" aria-label="Start a new recording">
                            New session
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <!-- usage — full metrics for the last transcription -->
                <div class="view transcript" data-view="usage" tabindex="-1" hidden>
                    <dl class="usage-list" id="usageList"></dl>
                    <div class="stage-footer">
                        <button class="ghost-btn icon-btn home-btn" id="usageHomeBtn" type="button" aria-label="Back to the start screen" title="Home">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
                        </button>
                        <button class="ghost-btn" id="backToTranscriptBtn" type="button">Back</button>
                        <button class="primary-btn compact icon-btn" id="usageNewSessionBtn" type="button" aria-label="Start a new recording">
                            New session
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <!-- error -->
                <div class="view" data-view="error" tabindex="-1" hidden>
                    <div class="stage-title" id="errorText" role="alert"></div>
                    <button class="ghost-btn" id="errorResetBtn" type="button">Try again</button>
                </div>

            </div>
        </div>

        <div class="bottom-bar">
            <!-- Connection state, always on show -->
            <span class="conn">
                <span class="sdot" id="serverDot" aria-hidden="true"></span>
                <span id="serverConn">Connecting</span>
            </span>

            <!-- Hidden while offline — the banner is the only status that matters then -->
            <div class="status-line" id="statusLine" role="status">
                <span class="sdot" id="statusDot" aria-hidden="true"></span>
                <span id="statusText">Ready</span>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
