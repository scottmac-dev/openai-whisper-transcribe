spring.application.name=assignment1-api

# Error handling. ApiExceptionHandler renders every failure as the spec's ErrorResponse
# schema, so Spring's own formats are switched off.
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Enable virtual threads
spring.threads.virtual.enabled=true

# Override springboot defaults of 1MB file size and 10MB request size
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# On shutdown signal, springboot will handle:
#  - Stop accepting new requests
#  - Allow existing requests to finish
#  - Shut down context
#  - Terminate JVM
server.shutdown=graceful

# Logging. App package at INFO
logging.level.com.comp3011.assignment1=INFO

# OpenAI STT endpoint and model. 
# Kept out of source code so tests can point the client at a local stub endpoint via a override.
openai.base-url=https://api.openai.com/v1/audio/transcriptions
openai.model=gpt-4o-mini-transcribe

# Fail-fast budget for the outbound call, derived from the spec's 5 second rule.
# Should perform initial connection in maximum 2 seconds
spring.http.client.connect-timeout=2s

# 4 second budget for response timeout allowing response within 5 second round trip
spring.http.client.read-timeout=4s

# Supplied at runtime from the OPENAI_API_KEY environment variable and never committed.
# The default is empty rather than a placeholder value, so no fake credential exists in the
# properties or the source.
openai.api-key=${OPENAI_API_KEY:}

