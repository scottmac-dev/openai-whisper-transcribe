spring.application.name=assignment1-api

# Enable virtual threads
spring.threads.virtual.enabled=true

# Override springboot defaults of 1MB file size and 10MB request size
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# On shutdown signal, springboot will handle:
#  - Stop accepting new requests
#  - Allow existing requests to finish
#  - Shut down context
#  - Terminate JVM
server.shutdown=graceful

# TODO: local testig only, defaults to 8080 for normal launch, remove before submission
server.port=5555

# TODO: remove stub key, just so app launches for testing
openai.api-key=${OPENAI_API_KEY:stub-key}
